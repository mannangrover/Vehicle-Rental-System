# Optional MySQL setup. Put the login in application-local.properties in the project folder.
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_rental?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
