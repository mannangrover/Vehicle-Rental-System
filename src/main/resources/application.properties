spring.application.name=vehicle-rental
server.port=8080

# JSP views
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# H2 database, saved in the data folder. It needs no install or password.
spring.datasource.url=jdbc:h2:file:./data/vehicle_rental;DATABASE_TO_LOWER=TRUE;WRITE_DELAY=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Database viewer at /h2-console, for looking at the tables during a demo.
# It only accepts connections from this computer.
spring.h2.console.enabled=true

# Create tables from schema.sql on startup (CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always

# Session cookie: not readable by scripts, and not sent on cross-site form posts
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# Show our own error page instead of the default one
server.error.whitelabel.enabled=false

# Demo accounts and vehicles, added only when the tables are empty
app.seed-demo-data=true
